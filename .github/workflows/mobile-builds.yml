          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle'); s=p.read_text()
          signing='''\n        signingConfigs {\n            sakakribRelease {\n                storeFile file(rootProject.file("keystores/sakakrib-upload.jks"))\n                storePassword System.getenv("ANDROID_SIGNING_KEYSTORE_PASSWORD")\n                keyAlias System.getenv("ANDROID_SIGNING_KEY_ALIAS")\n                keyPassword System.getenv("ANDROID_SIGNING_KEY_PASSWORD")\n            }\n        }\n'''
          if 'signingConfigs {' in s: raise SystemExit('Existing signingConfigs detected; refusing to patch blindly')
          if 'buildTypes {' not in s: raise SystemExit('Gradle buildTypes block missing')
          s=s.replace('buildTypes {',signing+'        buildTypes {',1)
