          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/release-cert.txt"
          APK_FP="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/release-cert.txt" | head -n 1 | tr '[:lower:]' '[:upper:]')"
          KEY_FP="$(keytool -list -v -keystore keystores/sakakrib-upload.jks -storepass "$ANDROID_SIGNING_KEYSTORE_PASSWORD" -alias "$ANDROID_SIGNING_KEY_ALIAS" 2>/dev/null | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          APK_FP_NORMALIZED="$(printf '%s' "$APK_FP" | tr -d ':')"
          if [ -z "$APK_FP_NORMALIZED" ] || [ "$APK_FP_NORMALIZED" != "$KEY_FP" ]; then echo "::error::APK signing fingerprint differs from configured keystore"; exit 1; fi
          printf '%s\n' "$APK_FP" > "$RUNNER_TEMP/android-release-sha256-fingerprint.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path

          fingerprint = Path(__import__('os').environ['RUNNER_TEMP'], 'android-release-sha256-fingerprint.txt').read_text().strip().replace(':', '').upper()
          associations = json.loads(Path('../public/.well-known/assetlinks.json').read_text())
          declared = {
              value.replace(':', '').upper()
              for entry in associations
              for value in entry.get('target', {}).get('sha256_cert_fingerprints', [])
              if entry.get('target', {}).get('package_name') == 'com.sakakrib.app'
          }
          if fingerprint not in declared:
              raise SystemExit('Stable APK certificate fingerprint is not present in public/.well-known/assetlinks.json')
          print(f'Android App Links fingerprint matches stable APK: {fingerprint}')
