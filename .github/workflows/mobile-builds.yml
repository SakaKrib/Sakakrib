            ET.SubElement(filt,'data',{a+'scheme':'https',a+'host':parsed.hostname,a+'pathPrefix':'/app/'})
          ET.indent(root,space='    '); p.write_text('<?xml version="1.0" encoding="utf-8"?>\n'+ET.tostring(root,encoding='unicode')+'\n')
