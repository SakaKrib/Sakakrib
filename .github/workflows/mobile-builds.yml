  ios:
    name: iOS Simulator Build
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out SakaKrib
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build React app
        env:
          VITE_DJANGO_API_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL }}
          VITE_DJANGO_API_FALLBACK_URL: ''
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID || '' }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID || vars.GOOGLE_IOS_CLIENT_IOS || secrets.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_IOS || '' }}
          VITE_PAYPAL_CLIENT_ID: ${{ vars.VITE_PAYPAL_CLIENT_ID || secrets.VITE_PAYPAL_CLIENT_ID || '' }}
          VITE_PAYPAL_ENVIRONMENT: ${{ vars.VITE_PAYPAL_ENVIRONMENT || 'sandbox' }}
          VITE_FIREBASE_PUSH_ENABLED: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' && 'true' || 'false' }}
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "::error::GOOGLE_CLIENT_ID is required for Google sign-in."; exit 1; }
          test -n "$VITE_GOOGLE_IOS_CLIENT_ID" || { echo "::error::GOOGLE_IOS_CLIENT_ID is required for native Google sign-in on iOS."; exit 1; }
          if [ -z "$VITE_PAYPAL_CLIENT_ID" ]; then
            echo "::error::VITE_PAYPAL_CLIENT_ID is missing. Add it as a GitHub Actions variable or secret before building mobile apps."
            exit 1
          fi
          npm run build
          if ! grep -R -F -- "$VITE_PAYPAL_CLIENT_ID" dist/assets/ >/dev/null; then
            echo "::error::The PayPal client ID was not embedded in the Vite build."
            exit 1
          fi

      - name: Ensure iOS project exists
        run: |
          if [ ! -f ios/App/App.xcodeproj/project.pbxproj ]; then
            echo "Tracked iOS platform is incomplete (missing project.pbxproj). Regenerating it from the installed Capacitor version."
            rm -rf ios
            npx cap add ios
          fi
          test -f ios/App/App.xcodeproj/project.pbxproj

      - name: Install Firebase iOS config and Universal Links entitlement
        env:
          FIREBASE_IOS_CONFIG_BASE64: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          IOS_APP_TEAM_ID: ${{ vars.IOS_APP_TEAM_ID || secrets.IOS_APP_TEAM_ID || '' }}
          SAKAKRIB_PUBLIC_BASE_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || secrets.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID || vars.GOOGLE_IOS_CLIENT_IOS || secrets.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_IOS || '' }}
        run: |
          python3 - <<'PY'
          import base64, os, plistlib
          from pathlib import Path
          from urllib.parse import urlsplit

          project = Path("ios/App/App.xcodeproj/project.pbxproj")
          config = os.environ.get("FIREBASE_IOS_CONFIG_BASE64", "").strip()
          if config:
              plist_bytes = base64.b64decode(config)
              firebase_config = plistlib.loads(plist_bytes)
              if firebase_config.get("BUNDLE_ID") != "com.sakakrib.app":
                  raise SystemExit("GoogleService-Info.plist must target com.sakakrib.app")
              Path("ios/App/App/GoogleService-Info.plist").write_bytes(plist_bytes)
              print("Firebase iOS client configuration decoded and validated.")
          else:
              print("::warning::Firebase iOS client plist is not supplied; native push stays disabled in the iOS build.")

          google_ios_client_id = os.environ.get("GOOGLE_IOS_CLIENT_ID", "").strip()
          if not google_ios_client_id:
              raise SystemExit("GOOGLE_IOS_CLIENT_ID is required for native Google sign-in on iOS.")
          suffix = ".apps.googleusercontent.com"
          if not google_ios_client_id.endswith(suffix):
              raise SystemExit("GOOGLE_IOS_CLIENT_ID is not a valid Google OAuth client ID.")
          reversed_client_id = "com.googleusercontent.apps." + google_ios_client_id[:-len(suffix)]
          info_path = Path("ios/App/App/Info.plist")
          info = plistlib.loads(info_path.read_bytes())
          url_types = info.setdefault("CFBundleURLTypes", [])
          if not any(reversed_client_id in item.get("CFBundleURLSchemes", []) for item in url_types):
              url_types.append({"CFBundleURLName": "Google Sign-In", "CFBundleURLSchemes": [reversed_client_id]})
          info_path.write_bytes(plistlib.dumps(info))
          print("Google Sign-In iOS URL scheme configured.")

          import re
          app_delegate_path = Path("ios/App/App/AppDelegate.swift")
          app_delegate = app_delegate_path.read_text(encoding="utf-8")
          if "import GoogleSignIn" not in app_delegate:
              capacitor_import = re.search(r"^import\s+Capacitor\s*$", app_delegate, re.MULTILINE)
              if not capacitor_import:
                  raise SystemExit("Could not locate Capacitor import in generated iOS AppDelegate.swift")
              app_delegate = (
                  app_delegate[:capacitor_import.end()]
                  + "\nimport GoogleSignIn"
                  + app_delegate[capacitor_import.end():]
              )

          if "GIDSignIn.sharedInstance.handle(url)" not in app_delegate:
              open_url_method = re.search(
                  r"(func\s+application\s*\([^)]*open\s+url\s*:\s*URL[^)]*\)\s*->\s*Bool\s*\{)",
                  app_delegate,
                  re.DOTALL,
              )
              google_callback = (
                  "\n        if GIDSignIn.sharedInstance.handle(url) { return true }"
              )
              if open_url_method:
                  insert_at = open_url_method.end()
                  app_delegate = (
                      app_delegate[:insert_at]
                      + google_callback
                      + app_delegate[insert_at:]
                  )
              else:
                  class_match = re.search(r"class\s+AppDelegate\b", app_delegate)
                  closing_brace = app_delegate.rfind("}")
                  if not class_match or closing_brace < class_match.end():
                      raise SystemExit("Could not locate AppDelegate class body for Google URL callback")
                  method = (
                      "\n\n    func application(_ app: UIApplication, open url: URL, "
                      "options: [UIApplication.OpenURLOptionsKey: Any]) -> Bool {"
                      "\n        if GIDSignIn.sharedInstance.handle(url) { return true }"
                      "\n        return ApplicationDelegateProxy.shared.application(app, open: url, options: options)"
                      "\n    }\n"
                  )
                  app_delegate = app_delegate[:closing_brace] + method + app_delegate[closing_brace:]

          app_delegate_path.write_text(app_delegate, encoding="utf-8")
          if "import GoogleSignIn" not in app_delegate or "GIDSignIn.sharedInstance.handle(url)" not in app_delegate:
              raise SystemExit("Google Sign-In URL callback patch did not apply")
          print("Google Sign-In URL callback handler configured in AppDelegate.swift.")

          team = os.environ.get("IOS_APP_TEAM_ID", "").strip()
          # The entitlement is included in the app build now; Apple Developer
          # capability/provisioning is enabled later when the owner enrolls.
          entitlements = {
              "com.apple.developer.applesignin": ["Default"]
          }
          if team:
              host = urlsplit(os.environ["SAKAKRIB_PUBLIC_BASE_URL"]).hostname
              if not host:
                  raise SystemExit("SAKAKRIB_PUBLIC_BASE_URL must include a public HTTPS host")
              entitlements["com.apple.developer.associated-domains"] = [f"applinks:{host}"]
              print(f"iOS Universal Links entitlement prepared for {host}.")
          else:
              print("::warning::IOS_APP_TEAM_ID is not set; iOS Universal Links cannot be verified until the Apple Team ID is configured.")
          Path("ios/App/App/App.entitlements").write_bytes(plistlib.dumps(entitlements))
          print("Sign in with Apple entitlement prepared for the iOS target.")
          PY
          gem install xcodeproj --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |candidate| candidate.name == 'App' }
          abort 'Capacitor App target was not found' unless target

          plist_path = 'ios/App/App/GoogleService-Info.plist'
          if File.exist?(plist_path)
            file_ref = project.main_group.find_subpath('App/GoogleService-Info.plist', true)
            unless target.resources_build_phase.files_references.include?(file_ref)
              target.resources_build_phase.add_file_reference(file_ref)
            end
          end

          if File.exist?('ios/App/App/App.entitlements')
            target.build_configurations.each do |configuration|
              configuration.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
            end
          end
          project.save
          puts 'iOS Firebase resource and Universal Links build settings synchronized.'
          RUBY
      - name: Generate and install iOS icons
        run: npm run generate:icons -- --sync

      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Remove duplicate iOS App folder resource
        run: |
          ruby - <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |candidate| candidate.name == 'App' }
          abort 'Capacitor App target was not found' unless target

          resources = target.resources_build_phase
          source_app_dir = File.expand_path('ios/App/App')
          removed = []

          # A directory-level PBXGroup/PBXVariantGroup pointing at the
          # application source folder gets copied as App.app/App, colliding
          # with the executable that Xcode creates at the same path.
          # Capacitor resources (public/, Assets.xcassets, plist files, etc.)
          # remain separate entries and must stay in Copy Bundle Resources.
          resources.files_references.dup.each do |reference|
            next unless reference
            next unless %w[PBXGroup PBXVariantGroup].include?(reference.isa)

            real_path = File.expand_path(reference.real_path.to_s)
            next unless real_path == source_app_dir

            puts "Removing duplicate iOS bundle directory resource: #{reference.isa} -> #{real_path}"
            resources.remove_file_reference(reference)
            removed << reference.isa
          end

          remaining = resources.files_references.compact.select do |reference|
            %w[PBXGroup PBXVariantGroup].include?(reference.isa) &&
              File.expand_path(reference.real_path.to_s) == source_app_dir
          end

          abort "Duplicate iOS App folder resource still exists in Copy Bundle Resources" unless remaining.empty?
          abort "Expected the duplicate App folder resource but found none; inspect generated Xcode project" if removed.empty?

          project.save
          puts "Removed #{removed.length} duplicate iOS App folder resource reference(s)."
          RUBY

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/SakaKribDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS Simulator app
        run: |
          APP_PATH="$RUNNER_TEMP/SakaKribDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/SakaKrib-iOS-Simulator.zip"

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: SakaKrib-iOS-Simulator-Build
          path: ${{ runner.temp }}/SakaKrib-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
