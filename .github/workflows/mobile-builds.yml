name: SakaKrib Mobile Builds

on:
  push:
    branches:
      - backup/casa-ai-before-push
  workflow_dispatch:
    inputs:
      build_android_release:
        description: "Build a stable-key-signed Android release APK (requires signing secrets)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: sakakrib-mobile-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out SakaKrib
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build React app
        env:
          VITE_DJANGO_API_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
          VITE_APP_LINK_BASE_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
          VITE_DJANGO_API_FALLBACK_URL: ''
          VITE_PAYPAL_CLIENT_ID: ${{ vars.VITE_PAYPAL_CLIENT_ID || secrets.VITE_PAYPAL_CLIENT_ID || '' }}
          VITE_PAYPAL_ENVIRONMENT: ${{ vars.VITE_PAYPAL_ENVIRONMENT || 'sandbox' }}
          VITE_FIREBASE_PUSH_ENABLED: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' && 'true' || 'false' }}
        run: |
          test -n "$VITE_DJANGO_API_URL"
          if [ -z "$VITE_PAYPAL_CLIENT_ID" ]; then
            echo "::error::VITE_PAYPAL_CLIENT_ID is missing. Add it as a GitHub Actions variable or secret before building mobile apps."
            exit 1
          fi
          npm run build
          if ! grep -R -F -- "$VITE_PAYPAL_CLIENT_ID" dist/assets/ >/dev/null; then
            echo "::error::The PayPal client ID was not embedded in the Vite build."
            exit 1
          fi
          if ! grep -R -F "$VITE_DJANGO_API_URL" dist/assets/; then
            echo "::error::The primary Django API URL was not embedded in the Vite build."
            exit 1
          fi
          if [ -n "$VITE_DJANGO_API_FALLBACK_URL" ] && ! grep -R -F "$VITE_DJANGO_API_FALLBACK_URL" dist/assets/; then
            echo "::error::The fallback Django API URL was not embedded in the Vite build."
            exit 1
          fi

      - name: Ensure Android manifest exists
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "Tracked Android platform is incomplete (missing $MANIFEST). Regenerating it from the installed Capacitor version."
            rm -rf android
            npx cap add android
          fi
          test -f "$MANIFEST"

      - name: Install Firebase Android client configuration
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            echo "::warning::Firebase Android client config is not supplied; native push stays disabled in this APK."
            exit 0
          fi
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          config = json.loads(Path("android/app/google-services.json").read_text())
          package_names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in config.get("client", [])
          }
          if "com.sakakrib.app" not in package_names:
              raise SystemExit("Firebase google-services.json must include package com.sakakrib.app")

          root_gradle = Path("android/build.gradle")
          app_gradle = Path("android/app/build.gradle")
          root_text = root_gradle.read_text()
          app_text = app_gradle.read_text()
          plugin = "com.google.gms.google-services"
          if plugin not in root_text:
              dependency_block = re.search(r"dependencies\s*\{", root_text)
              if dependency_block:
                  insert_at = dependency_block.end()
                  root_text = root_text[:insert_at] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + root_text[insert_at:]
              else:
                  root_text += "\nplugins { id 'com.google.gms.google-services' version '4.4.2' apply false }\n"
          if plugin not in app_text:
              app_text += "\napply plugin: 'com.google.gms.google-services'\n"
          root_gradle.write_text(root_text)
          app_gradle.write_text(app_text)
          print("Firebase Android client config and Gradle plugin installed.")
          PY

      - name: Configure verified Android App Links
        env:
          SAKAKRIB_PUBLIC_BASE_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          from pathlib import Path

          base_url = os.environ["SAKAKRIB_PUBLIC_BASE_URL"].strip()
          parsed = urlsplit(base_url)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("SAKAKRIB_PUBLIC_BASE_URL must be a valid HTTPS URL")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          root = ET.fromstring(content)
          activity = next(
              (node for node in root.iter("activity")
               if node.get(f"{{{android_ns}}}name", "").endswith("MainActivity")),
              None,
          )
          if activity is None:
              raise SystemExit("Could not find the Capacitor MainActivity in AndroidManifest.xml")

          paths = (
              "/paypal/subscription/return",
              "/paypal/subscription/cancel",
              "/listing/payment/return",
          )
          for path in paths:
              exists = any(
                  intent.get(f"{{{android_ns}}}autoVerify") == "true"
                  and any(
                      data.get(f"{{{android_ns}}}host") == parsed.hostname
                      and data.get(f"{{{android_ns}}}path") == path
                      for data in intent.findall("data")
                  )
                  for intent in activity.findall("intent-filter")
              )
              if exists:
                  continue
              intent = ET.SubElement(activity, "intent-filter", {
                  f"{{{android_ns}}}autoVerify": "true"
              })
              ET.SubElement(intent, "action", {
                  f"{{{android_ns}}}name": "android.intent.action.VIEW"
              })
              ET.SubElement(intent, "category", {
                  f"{{{android_ns}}}name": "android.intent.category.DEFAULT"
              })
              ET.SubElement(intent, "category", {
                  f"{{{android_ns}}}name": "android.intent.category.BROWSABLE"
              })
              ET.SubElement(intent, "data", {
                  f"{{{android_ns}}}scheme": "https",
                  f"{{{android_ns}}}host": parsed.hostname,
                  f"{{{android_ns}}}path": path,
              })

          app_link_exists = any(
              intent.get(f"{{{android_ns}}}autoVerify") == "true"
              and any(
                  data.get(f"{{{android_ns}}}host") == parsed.hostname
                  and data.get(f"{{{android_ns}}}pathPrefix") == "/app/"
                  for data in intent.findall("data")
              )
              for intent in activity.findall("intent-filter")
          )
          if not app_link_exists:
              intent = ET.SubElement(activity, "intent-filter", {
                  f"{{{android_ns}}}autoVerify": "true"
              })
              ET.SubElement(intent, "action", {
                  f"{{{android_ns}}}name": "android.intent.action.VIEW"
              })
              ET.SubElement(intent, "category", {
                  f"{{{android_ns}}}name": "android.intent.category.DEFAULT"
              })
              ET.SubElement(intent, "category", {
                  f"{{{android_ns}}}name": "android.intent.category.BROWSABLE"
              })
              ET.SubElement(intent, "data", {
                  f"{{{android_ns}}}scheme": "https",
                  f"{{{android_ns}}}host": parsed.hostname,
                  f"{{{android_ns}}}pathPrefix": "/app/",
              })

          ET.indent(root, space="    ")
          manifest.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              + ET.tostring(root, encoding="unicode") + "\n",
              encoding="utf-8",
          )
          print(f"Android App Links configured for {parsed.hostname}")
          PY

      - name: Declare Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest not found: {manifest}")

          content = manifest.read_text(encoding="utf-8")
          entries = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />',
          ]
          application_index = content.find("<application")
          if application_index < 0:
              raise SystemExit("Could not find <application> in AndroidManifest.xml")

          missing = [
              entry for entry in entries
              if entry.split('"')[1] not in content
          ]
          if missing:
              content = content[:application_index] + "\n".join(missing) + "\n    " + content[application_index:]
              manifest.write_text(content, encoding="utf-8")

          final_content = manifest.read_text(encoding="utf-8")
          for permission in (
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ):
              if permission not in final_content:
                  raise SystemExit(f"Required Android location permission missing: {permission}")
          print("Android location permissions are declared.")
          PY

      - name: Install Saka Krib native WebView configuration
        run: |
          mkdir -p android/app/src/main/java/com/sakakrib/app
          cp native/android/MainActivity.java android/app/src/main/java/com/sakakrib/app/MainActivity.java
          grep -q "setAcceptThirdPartyCookies" android/app/src/main/java/com/sakakrib/app/MainActivity.java

      - name: Generate and install Android icons
        run: npm run generate:icons -- --sync --patch-manifest

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify generated Android App Link manifest
        env:
          SAKAKRIB_PUBLIC_BASE_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          from pathlib import Path
          root=ET.parse(Path("android/app/src/main/AndroidManifest.xml")).getroot()
          ns="{http://schemas.android.com/apk/res/android}"
          host=urlsplit(os.environ["SAKAKRIB_PUBLIC_BASE_URL"]).hostname
          expected={"/paypal/subscription/return","/paypal/subscription/cancel","/listing/payment/return"}
          found=set()
          for act in root.iter("activity"):
            for intent in act.findall("intent-filter"):
              if intent.get(ns+"autoVerify")!="true": continue
              actions={x.get(ns+"name") for x in intent.findall("action")}
              cats={x.get(ns+"name") for x in intent.findall("category")}
              if "android.intent.action.VIEW" not in actions or "android.intent.category.DEFAULT" not in cats or "android.intent.category.BROWSABLE" not in cats:
                raise SystemExit("App Link filter missing required action/category")
              for data in intent.findall("data"):
                if data.get(ns+"scheme")=="https" and data.get(ns+"host")==host and data.get(ns+"path") in expected:
                    found.add(data.get(ns+"path"))
          missing=expected-found
          if missing: raise SystemExit(f"Generated manifest missing App Link filters: {sorted(missing)}")
          app_prefix_found = any(
            intent.get(ns+"autoVerify")=="true" and any(
              data.get(ns+"host")==host and data.get(ns+"pathPrefix")=="/app/"
              for data in intent.findall("data")
            )
            for activity in root.iter("activity") for intent in activity.findall("intent-filter")
          )
          if not app_prefix_found: raise SystemExit("Generated manifest missing /app/ App Link prefix")
          print(f"Verified App Link manifest for {host}: {sorted(found)} plus /app/")
          PY

      - name: Verify Android location permissions before packaging
        run: |
          grep -q "android.permission.ACCESS_COARSE_LOCATION" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify permissions inside APK
        working-directory: android
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/apk-permissions.txt"
          grep -q "android.permission.ACCESS_COARSE_LOCATION" "$RUNNER_TEMP/apk-permissions.txt"
          grep -q "android.permission.ACCESS_FINE_LOCATION" "$RUNNER_TEMP/apk-permissions.txt"

      - name: Record ephemeral debug APK certificate fingerprint
        working-directory: android
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/android-signing-certificate.txt"
          FINGERPRINT="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/android-signing-certificate.txt" | head -n 1)"
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::Could not extract the APK SHA-256 signing fingerprint."
            exit 1
          fi
          printf '%s\n' "$FINGERPRINT" > "$RUNNER_TEMP/android-debug-ephemeral-sha256-fingerprint.txt"
          echo "EPHEMERAL DEBUG APK SHA-256 fingerprint (not for assetlinks): $FINGERPRINT"
          echo "::warning::This debug APK uses the GitHub runner's ephemeral debug certificate. Never use this fingerprint for permanent Android App Links verification."

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SakaKrib-Android-Debug-APK (ephemeral signature)
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/android-debug-ephemeral-sha256-fingerprint.txt
          if-no-files-found: error
          retention-days: 14

  android_release:
    name: Android Release APK (stable signing)
    # This workflow lives on the feature branch, not the repository default branch.
    # Build the stable-signed release on every push to this branch so no default-branch
    # workflow_dispatch registration is required. Manual dispatch remains supported too.
    if: github.ref == 'refs/heads/backup/casa-ai-before-push' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_android_release == true))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require stable Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required stable signing secret $name is missing. Refusing to build a release with a debug key."
              exit 1
            fi
          done
      - name: Check out SakaKrib
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build React app for Android release
        env:
          VITE_DJANGO_API_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
          VITE_APP_LINK_BASE_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
          VITE_DJANGO_API_FALLBACK_URL: ''
          VITE_PAYPAL_CLIENT_ID: ${{ vars.VITE_PAYPAL_CLIENT_ID || secrets.VITE_PAYPAL_CLIENT_ID || '' }}
          VITE_PAYPAL_ENVIRONMENT: ${{ vars.VITE_PAYPAL_ENVIRONMENT || 'sandbox' }}
          VITE_FIREBASE_PUSH_ENABLED: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' && 'true' || 'false' }}
        run: |
          test -n "$VITE_DJANGO_API_URL"
          test -n "$VITE_PAYPAL_CLIENT_ID" || { echo "::error::VITE_PAYPAL_CLIENT_ID is required"; exit 1; }
          npm run build
      - name: Ensure Android project exists
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then rm -rf android; npx cap add android; fi
          test -f android/app/src/main/AndroidManifest.xml
      - name: Install Firebase Android client configuration for release
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            echo "::warning::Firebase Android client config is not supplied; native push stays disabled in the release APK."
            exit 0
          fi
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          config=json.loads(Path("android/app/google-services.json").read_text())
          packages={x.get("client_info",{}).get("android_client_info",{}).get("package_name") for x in config.get("client",[])}
          if "com.sakakrib.app" not in packages: raise SystemExit("Firebase config must include com.sakakrib.app")
          root=Path("android/build.gradle"); app=Path("android/app/build.gradle")
          root_text=root.read_text(); app_text=app.read_text(); plugin="com.google.gms.google-services"
          if plugin not in root_text:
            match=re.search(r"dependencies\s*\{",root_text)
            if match: root_text=root_text[:match.end()]+"\n        classpath 'com.google.gms:google-services:4.4.2'"+root_text[match.end():]
            else: root_text+="\nplugins { id 'com.google.gms.google-services' version '4.4.2' apply false }\n"
          if plugin not in app_text: app_text+="\napply plugin: 'com.google.gms.google-services'\n"
          root.write_text(root_text); app.write_text(app_text)
          print("Firebase Android release config installed.")
          PY
      - name: Configure release manifest App Links
        env:
          SAKAKRIB_PUBLIC_BASE_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          from pathlib import Path
          parsed=urlsplit(os.environ['SAKAKRIB_PUBLIC_BASE_URL'].strip())
          if parsed.scheme!='https' or not parsed.hostname: raise SystemExit('Public base URL must be HTTPS')
          p=Path('android/app/src/main/AndroidManifest.xml'); root=ET.parse(p).getroot()
          ns='http://schemas.android.com/apk/res/android'; a='{'+ns+'}'; ET.register_namespace('android',ns)
          act=next((x for x in root.iter('activity') if x.get(a+'name','').endswith('MainActivity')),None)
          if act is None: raise SystemExit('MainActivity missing from manifest')
          for path in ('/paypal/subscription/return','/paypal/subscription/cancel','/listing/payment/return'):
            already=any(
              intent.get(a+'autoVerify')=='true' and
              any(d.get(a+'scheme')=='https' and d.get(a+'host')==parsed.hostname and d.get(a+'path')==path for d in intent.findall('data'))
              for intent in act.findall('intent-filter')
            )
            if already: continue
            filt=ET.SubElement(act,'intent-filter',{a+'autoVerify':'true'})
            ET.SubElement(filt,'action',{a+'name':'android.intent.action.VIEW'})
            ET.SubElement(filt,'category',{a+'name':'android.intent.category.DEFAULT'})
            ET.SubElement(filt,'category',{a+'name':'android.intent.category.BROWSABLE'})
            ET.SubElement(filt,'data',{a+'scheme':'https',a+'host':parsed.hostname,a+'path':path})
          app_prefix_found=any(
            intent.get(a+'autoVerify')=='true' and
            any(d.get(a+'scheme')=='https' and d.get(a+'host')==parsed.hostname and d.get(a+'pathPrefix')=='/app/' for d in intent.findall('data'))
            for intent in act.findall('intent-filter')
          )
          if not app_prefix_found:
            filt=ET.SubElement(act,'intent-filter',{a+'autoVerify':'true'})
            ET.SubElement(filt,'action',{a+'name':'android.intent.action.VIEW'})
            ET.SubElement(filt,'category',{a+'name':'android.intent.category.DEFAULT'})
            ET.SubElement(filt,'category',{a+'name':'android.intent.category.BROWSABLE'})
            ET.SubElement(filt,'data',{a+'scheme':'https',a+'host':parsed.hostname,a+'pathPrefix':'/app/'})
          ET.indent(root,space='    '); p.write_text('<?xml version="1.0" encoding="utf-8"?>\n'+ET.tostring(root,encoding='unicode')+'\n')
          PY
      - name: Declare Android location permissions for release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          required = {
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          }
          present = {
              node.get(android + "name")
              for node in root.findall("uses-permission")
          }
          for permission in sorted(required - present):
              ET.SubElement(root, "uses-permission", {android + "name": permission})
          gps = root.find("uses-feature[@android:name='android.hardware.location.gps']", {"android": "http://schemas.android.com/apk/res/android"})
          if gps is None:
              ET.SubElement(root, "uses-feature", {
                  android + "name": "android.hardware.location.gps",
                  android + "required": "false",
              })
          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          final = path.read_text(encoding="utf-8")
          for permission in required:
              if permission not in final:
                  raise SystemExit(f"Missing required permission: {permission}")
          print("Release manifest includes coarse and fine location permissions.")
          PY
      - name: Generate and install Android icons
        run: npm run generate:icons -- --sync --patch-manifest
      - name: Install native WebView configuration
        run: |
          mkdir -p android/app/src/main/java/com/sakakrib/app
          cp native/android/MainActivity.java android/app/src/main/java/com/sakakrib/app/MainActivity.java
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Verify generated release Android permissions
        run: |
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
      - name: Verify generated release Android App Link manifest
        env:
          SAKAKRIB_PUBLIC_BASE_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          from pathlib import Path
          root=ET.parse(Path('android/app/src/main/AndroidManifest.xml')).getroot()
          a='{http://schemas.android.com/apk/res/android}'
          host=urlsplit(os.environ['SAKAKRIB_PUBLIC_BASE_URL']).hostname
          expected={'/paypal/subscription/return','/paypal/subscription/cancel','/listing/payment/return'}; found=set()
          for activity in root.iter('activity'):
            for intent in activity.findall('intent-filter'):
              if intent.get(a+'autoVerify')!='true': continue
              actions={e.get(a+'name') for e in intent.findall('action')}; cats={e.get(a+'name') for e in intent.findall('category')}
              if 'android.intent.action.VIEW' not in actions or 'android.intent.category.DEFAULT' not in cats or 'android.intent.category.BROWSABLE' not in cats:
                raise SystemExit('App Link intent filter lacks required action/category')
              for data in intent.findall('data'):
                if data.get(a+'scheme')=='https' and data.get(a+'host')==host and data.get(a+'path') in expected: found.add(data.get(a+'path'))
          if expected-found: raise SystemExit(f'Missing release App Link filters: {sorted(expected-found)}')
          app_prefix_found=any(
            intent.get(a+'autoVerify')=='true' and any(d.get(a+'host')==host and d.get(a+'pathPrefix')=='/app/' for d in intent.findall('data'))
            for activity in root.iter('activity') for intent in activity.findall('intent-filter')
          )
          if not app_prefix_found: raise SystemExit('Missing /app/ App Link prefix')
          print(f'Validated release manifest App Links: {sorted(found)} plus /app/')
          PY

      - name: Install stable keystore and configure release signing
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystores
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > android/keystores/sakakrib-upload.jks
          chmod 600 android/keystores/sakakrib-upload.jks
          keytool -list -keystore android/keystores/sakakrib-upload.jks -storepass "$ANDROID_SIGNING_KEYSTORE_PASSWORD" -alias "$ANDROID_SIGNING_KEY_ALIAS" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle'); s=p.read_text()
          signing='''\n        signingConfigs {\n            sakakribRelease {\n                storeFile file(rootProject.file("keystores/sakakrib-upload.jks"))\n                storePassword System.getenv("ANDROID_SIGNING_KEYSTORE_PASSWORD")\n                keyAlias System.getenv("ANDROID_SIGNING_KEY_ALIAS")\n                keyPassword System.getenv("ANDROID_SIGNING_KEY_PASSWORD")\n            }\n        }\n'''
          if 'signingConfigs {' in s: raise SystemExit('Existing signingConfigs detected; refusing to patch blindly')
          if 'buildTypes {' not in s: raise SystemExit('Gradle buildTypes block missing')
          s=s.replace('buildTypes {',signing+'        buildTypes {',1)
          if 'release {' not in s: raise SystemExit('Gradle release build type missing')
          s=s.replace('release {','release { signingConfig signingConfigs.sakakribRelease',1)
          p.write_text(s)
          PY
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Verify release APK signature and persistent fingerprint
        working-directory: android
        env:
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"; test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"; test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/release-cert.txt"
          APK_FP="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/release-cert.txt" | head -n 1 | tr '[:lower:]' '[:upper:]')"
          KEY_FP="$(keytool -list -v -keystore keystores/sakakrib-upload.jks -storepass "$ANDROID_SIGNING_KEYSTORE_PASSWORD" -alias "$ANDROID_SIGNING_KEY_ALIAS" 2>/dev/null | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          APK_FP_NORMALIZED="$(printf '%s' "$APK_FP" | tr -d ':')"
          if [ -z "$APK_FP_NORMALIZED" ] || [ "$APK_FP_NORMALIZED" != "$KEY_FP" ]; then echo "::error::APK signing fingerprint differs from configured keystore"; exit 1; fi
          printf '%s\n' "$APK_FP" > "$RUNNER_TEMP/android-release-sha256-fingerprint.txt"
          echo "Verified release APK stable signing fingerprint: $APK_FP"
      - name: Upload stable-signed Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: SakaKrib-Android-Release-Stable-Signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/android-release-sha256-fingerprint.txt
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS Simulator Build
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out SakaKrib
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build React app
        env:
          VITE_DJANGO_API_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
          VITE_APP_LINK_BASE_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
          VITE_DJANGO_API_FALLBACK_URL: ''
          VITE_PAYPAL_CLIENT_ID: ${{ vars.VITE_PAYPAL_CLIENT_ID || secrets.VITE_PAYPAL_CLIENT_ID || '' }}
          VITE_PAYPAL_ENVIRONMENT: ${{ vars.VITE_PAYPAL_ENVIRONMENT || 'sandbox' }}
          VITE_FIREBASE_PUSH_ENABLED: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' && 'true' || 'false' }}
        run: |
          if [ -z "$VITE_PAYPAL_CLIENT_ID" ]; then
            echo "::error::VITE_PAYPAL_CLIENT_ID is missing. Add it as a GitHub Actions variable or secret before building mobile apps."
            exit 1
          fi
          npm run build
          if ! grep -R -F -- "$VITE_PAYPAL_CLIENT_ID" dist/assets/ >/dev/null; then
            echo "::error::The PayPal client ID was not embedded in the Vite build."
            exit 1
          fi

      - name: Ensure iOS project exists
        run: |
          if [ ! -f ios/App/App.xcodeproj/project.pbxproj ]; then
            echo "Tracked iOS platform is incomplete (missing project.pbxproj). Regenerating it from the installed Capacitor version."
            rm -rf ios
            npx cap add ios
          fi
          test -f ios/App/App.xcodeproj/project.pbxproj

      - name: Install Firebase iOS config and Universal Links entitlement
        env:
          FIREBASE_IOS_CONFIG_BASE64: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          IOS_APP_TEAM_ID: ${{ vars.IOS_APP_TEAM_ID || secrets.IOS_APP_TEAM_ID || '' }}
          SAKAKRIB_PUBLIC_BASE_URL: ${{ vars.SAKAKRIB_PUBLIC_BASE_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
        run: |
          python3 - <<'PY'
          import base64, os, re, subprocess, uuid
          from pathlib import Path
          from urllib.parse import urlsplit

          project = Path("ios/App/App.xcodeproj/project.pbxproj")
          text = project.read_text()
          config = os.environ.get("FIREBASE_IOS_CONFIG_BASE64", "").strip()
          if config:
              plist = Path("ios/App/App/GoogleService-Info.plist")
              plist.write_bytes(base64.b64decode(config))
              bundle = subprocess.check_output(["/usr/libexec/PlistBuddy", "-c", "Print :BUNDLE_ID", str(plist)], text=True).strip()
              if bundle != "com.sakakrib.app":
                  raise SystemExit("GoogleService-Info.plist must target com.sakakrib.app")
              file_id = uuid.uuid4().hex[:24].upper()
              build_id = uuid.uuid4().hex[:24].upper()
              if "GoogleService-Info.plist" not in text:
                  ref = f"\t\t{file_id} /* GoogleService-Info.plist */ = {{isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = GoogleService-Info.plist; sourceTree = \"<group>\"; }};\n"
                  build = f"\t\t{build_id} /* GoogleService-Info.plist in Resources */ = {{isa = PBXBuildFile; fileRef = {file_id} /* GoogleService-Info.plist */; }};\n"
                  text = text.replace("/* Begin PBXBuildFile section */", "/* Begin PBXBuildFile section */\n" + build, 1)
                  text = text.replace("/* Begin PBXFileReference section */", "/* Begin PBXFileReference section */\n" + ref, 1)
                  group = re.search(r"(\w+ /\* App \*/ = \{[^}]*?children = \()", text)
                  if not group:
                      group = re.search(r"(children = \([^)]*?)(\);[^)]*?path = App;)", text, re.S)
                      if group:
                          text = text[:group.end(1)] + f"\n\t\t\t\t{file_id} /* GoogleService-Info.plist */," + text[group.end(1):]
                  else:
                      text = text[:group.end(1)] + f"\n\t\t\t\t{file_id} /* GoogleService-Info.plist */," + text[group.end(1):]
                  resources = re.search(r"(\/\* Resources \*\/ = \{\s*isa = PBXResourcesBuildPhase;\s*buildActionMask = \d+;\s*files = \()", text)
                  if not resources:
                      raise SystemExit("Could not locate the iOS App Resources build phase for Firebase plist")
                  text = text[:resources.end(1)] + f"\n\t\t\t\t{build_id} /* GoogleService-Info.plist in Resources */," + text[resources.end(1):]
              print("Firebase iOS client plist installed.")
          else:
              print("::warning::Firebase iOS client plist is not supplied; native push stays disabled in the iOS build.")

          team = os.environ.get("IOS_APP_TEAM_ID", "").strip()
          if team:
              host = urlsplit(os.environ["SAKAKRIB_PUBLIC_BASE_URL"]).hostname
              if not host: raise SystemExit("SAKAKRIB_PUBLIC_BASE_URL must include a host")
              entitlements = Path("ios/App/App/App.entitlements")
              entitlements.write_text(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
                  '<plist version="1.0"><dict><key>com.apple.developer.associated-domains</key><array>'
                  f'<string>applinks:{host}</string></array></dict></plist>\n'
              )
              text = re.sub(
                  r"(PRODUCT_BUNDLE_IDENTIFIER = com\.sakakrib\.app;)",
                  r"\1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;",
                  text,
              )
              print(f"iOS Universal Links entitlement configured for {host}.")
          else:
              print("::warning::IOS_APP_TEAM_ID is not set; iOS Universal Links cannot be verified until the Apple Team ID is configured.")
          project.write_text(text)
          PY

      - name: Generate and install iOS icons
        run: npm run generate:icons -- --sync

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/SakaKribDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS Simulator app
        run: |
          APP_PATH="$RUNNER_TEMP/SakaKribDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/SakaKrib-iOS-Simulator.zip"

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: SakaKrib-iOS-Simulator-Build
          path: ${{ runner.temp }}/SakaKrib-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
