          p=Path('android/app/src/main/AndroidManifest.xml'); root=ET.parse(p).getroot()
          ns='http://schemas.android.com/apk/res/android'; a='{'+ns+'}'; ET.register_namespace('android',ns)
          act=next((x for x in root.iter('activity') if x.get(a+'name','').endswith('MainActivity')),None)
          if act is None: raise SystemExit('MainActivity missing from manifest')
          for path in ('/paypal/subscription/return','/paypal/subscription/cancel','/listing/payment/return'):
            already=any(
              intent.get(a+'autoVerify')=='true' and
