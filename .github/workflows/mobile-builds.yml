name: SakaKrib Mobile Builds

on:
  push:
    branches:
      - backup/casa-ai-before-push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakakrib-mobile-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out SakaKrib
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build React app
        env:
          VITE_DJANGO_API_URL: ${{ vars.VITE_DJANGO_API_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
          VITE_DJANGO_API_FALLBACK_URL: ${{ vars.VITE_DJANGO_API_FALLBACK_URL || '' }}
          VITE_FIREBASE_PUSH_ENABLED: 'false'
        run: |
          test -n "$VITE_DJANGO_API_URL"
          npm run build
          if ! grep -R -F "$VITE_DJANGO_API_URL" dist/assets/; then
            echo "::error::The primary Django API URL was not embedded in the Vite build."
            exit 1
          fi
          if [ -n "$VITE_DJANGO_API_FALLBACK_URL" ] && ! grep -R -F "$VITE_DJANGO_API_FALLBACK_URL" dist/assets/; then
            echo "::error::The fallback Django API URL was not embedded in the Vite build."
            exit 1
          fi

      - name: Generate Android project
        run: npx cap add android

      - name: Declare Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest not found: {manifest}")

          content = manifest.read_text(encoding="utf-8")
          entries = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />',
          ]
          application_index = content.find("<application")
          if application_index < 0:
              raise SystemExit("Could not find <application> in AndroidManifest.xml")

          missing = [
              entry for entry in entries
              if entry.split('"')[1] not in content
          ]
          if missing:
              content = content[:application_index] + "\\n".join(missing) + "\\n    " + content[application_index:]
              manifest.write_text(content, encoding="utf-8")

          final_content = manifest.read_text(encoding="utf-8")
          for permission in (
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ):
              if permission not in final_content:
                  raise SystemExit(f"Required Android location permission missing: {permission}")
          print("Android location permissions are declared.")
          PY

      - name: Install Saka Krib native WebView configuration
        run: |
          mkdir -p android/app/src/main/java/com/sakakrib/app
          cp native/android/MainActivity.java android/app/src/main/java/com/sakakrib/app/MainActivity.java
          grep -q "setAcceptThirdPartyCookies" android/app/src/main/java/com/sakakrib/app/MainActivity.java

      - name: Generate and install Android icons
        run: npm run generate:icons -- --sync --patch-manifest

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android location permissions before packaging
        run: |
          grep -q "android.permission.ACCESS_COARSE_LOCATION" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify permissions inside APK
        working-directory: android
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/apk-permissions.txt"
          grep -q "android.permission.ACCESS_COARSE_LOCATION" "$RUNNER_TEMP/apk-permissions.txt"
          grep -q "android.permission.ACCESS_FINE_LOCATION" "$RUNNER_TEMP/apk-permissions.txt"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SakaKrib-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS Simulator Build
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out SakaKrib
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build React app
        env:
          VITE_DJANGO_API_URL: ${{ vars.VITE_DJANGO_API_URL || 'https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net' }}
          VITE_DJANGO_API_FALLBACK_URL: ${{ vars.VITE_DJANGO_API_FALLBACK_URL || '' }}
          VITE_FIREBASE_PUSH_ENABLED: 'false'
        run: npm run build

      - name: Generate iOS project
        run: npx cap add ios

      - name: Generate and install iOS icons
        run: npm run generate:icons -- --sync --patch-manifest

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/SakaKribDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS Simulator app
        run: |
          APP_PATH="$RUNNER_TEMP/SakaKribDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/SakaKrib-iOS-Simulator.zip"

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: SakaKrib-iOS-Simulator-Build
          path: ${{ runner.temp }}/SakaKrib-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
