          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          android_ns = "http://schemas.android.com/apk/res/android"
          android = "{" + android_ns + "}"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          activity = next(
              (node for node in root.iter("activity")
               if node.get(android + "name", "").endswith("MainActivity")),
              None,
          )
          if activity is None:
              raise SystemExit("Could not find MainActivity for Apple callback deep link")

          def matches(intent):
              return any(
                  data.get(android + "scheme") == "com.sakakrib.app"
                  and data.get(android + "host") == "apple-login"
                  for data in intent.findall("data")
              )

          if not any(matches(intent) for intent in activity.findall("intent-filter")):
              intent = ET.SubElement(activity, "intent-filter")
              ET.SubElement(intent, "action", {
                  android + "name": "android.intent.action.VIEW"
