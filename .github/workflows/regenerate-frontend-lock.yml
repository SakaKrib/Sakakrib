name: Regenerate frontend lockfile

on:
  push:
    branches:
      - django-backend-migration

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: django-backend-migration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/regenerate-frontend-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate lockfile after Supabase removal"
          git push origin HEAD:django-backend-migration
