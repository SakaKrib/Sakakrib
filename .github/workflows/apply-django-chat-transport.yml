name: Apply Django chat transport migration

on:
  push:
    branches: [django-backend-migration]

permissions:
  contents: write

jobs:
  migrate-chat-page:
    if: ${{ !contains(github.event.head_commit.message, '[chat-transport-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: django-backend-migration
          fetch-depth: 1

      - name: Patch ChatPage transport
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/pages/ChatPage.tsx')
          text = path.read_text()
          if 'DJANGO_CHAT_TRANSPORT' in text:
              print('ChatPage already migrated')
              raise SystemExit(0)

          text = text.replace(
              "import { protectedGet, protectedPost } from '@/lib/protectedApi';",
              "import { protectedGet, protectedPost } from '@/lib/djangoApi';\n\n// DJANGO_CHAT_TRANSPORT",
          )

          text = text.replace(
              """        const baseUrl =\n          import.meta.env\n            .VITE_SUPABASE_URL as\n            | string\n            | undefined;""",
              """        const baseUrl =\n          import.meta.env\n            .VITE_DJANGO_API_URL as\n            | string\n            | undefined;""",
          )
          text = text.replace(
              "`${baseUrl.replace(/\\/+$/, '')}/functions/v1/${MEDIA_FUNCTION}`",
              "`${baseUrl.replace(/\\/+$/, '')}/api/core/chat/media/`",
          )
          text = text.replace(
              """        const baseUrl =\n      import.meta.env\n        .VITE_SUPABASE_URL as\n        | string\n        | undefined;""",
              """        const baseUrl =\n      import.meta.env\n        .VITE_DJANGO_API_URL as\n        | string\n        | undefined;""",
          )

          text = text.replace(
              """        protectedGet<ChatMessage[]>(\n          `/rest/v1/chat_messages?select=*&conversation_id=eq.${encodeURIComponent(\n            conversationId,\n          )}&order=created_at.asc`,\n        ),""",
              """        protectedGet<{ messages: ChatMessage[] }>(\n          `/api/core/chat/?conversation_id=${encodeURIComponent(conversationId)}&limit=100`,\n        ),""",
          )
          text = text.replace(
              """      setMessages(\n        asRows(generalMessages),\n      );""",
              """      setMessages(\n        asRows(generalMessages?.messages),\n      );""",
          )

          # Chat message creation is now server-owned; sender and conversation are derived from HttpOnly JWT.
          text = text.replace("'/rest/v1/chat_messages'", "'/api/core/chat/'")
          text = text.replace("""              conversation_id:\n                conversationId,\n              sender_id:\n                profile.id,\n              receiver_id:\n                receiverId,""", """              receiver_id:\n                receiverId,""")

          # Django media endpoint accepts the same multipart file and returns the Supabase-compatible attachment shape.
          marker = """          form.append(\n            'file',\n            file,\n          );"""
          text = text.replace(marker, marker + "\n\n          form.append('conversation_id', conversationId);")

          # Replace Supabase EventSource chat stream with Django Channels WebSocket.
          pattern = re.compile(
              r"  /\*\*\n   \* Realtime chat stream\..*?\n  useEffect\(\(\) => \{.*?\n  \}, \[\n    profile,\n    mover,\n    conversationId,\n  \]\);",
              re.S,
          )
          replacement = r'''  /**
   * Django Channels realtime chat stream.
   * The access JWT remains in the HttpOnly cookie and is validated by the WebSocket middleware.
   */
  useEffect(() => {
    if (!profile || !mover || !conversationId) {
      return;
    }

    const configured = import.meta.env.VITE_DJANGO_API_URL as string | undefined;
    const httpBase = (configured || window.location.origin).replace(/\/+$/, '');
    const wsBase = httpBase.replace(/^http:/i, 'ws:').replace(/^https:/i, 'wss:');
    const stream = new WebSocket(`${wsBase}/ws/chat/${conversationId}/`);
    streamRef.current = stream as unknown as EventSource;

    stream.onmessage = (event) => {
      try {
        const payload = JSON.parse(event.data) as {
          type?: string;
          message?: ChatMessage;
        };
        if (payload.type !== 'message' || !payload.message) {
          return;
        }
        const message = payload.message;
        if (message.conversation_id !== conversationId) {
          return;
        }
        setMessages((previous) => {
          const map = new Map(previous.map((item) => [item.id, item]));
          map.set(message.id, message);
          return Array.from(map.values()).sort(
            (a, b) => new Date(a.created_at).getTime() - new Date(b.created_at).getTime(),
          );
        });
      } catch (error) {
        console.error('Invalid Django chat WebSocket message:', error);
      }
    };

    return () => {
      stream.close();
      streamRef.current = null;
    };
  }, [profile, mover, conversationId]);'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate ChatPage realtime effect')

          # Use a WebSocket-compatible ref type without changing the surrounding component structure.
          text = text.replace(
              "const streamRef =\n    useRef<EventSource | null>(null);",
              "const streamRef =\n    useRef<{ close: () => void } | null>(null);",
          )
          text = text.replace(
              "streamRef.current = stream as unknown as EventSource;",
              "streamRef.current = stream;",
          )

          path.write_text(text)

      - name: Commit migrated ChatPage
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ChatPage.tsx
          if git diff --cached --quiet; then
            echo 'No ChatPage changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate ChatPage to Django chat transport [chat-transport-migrated]'
          git push origin HEAD:django-backend-migration
