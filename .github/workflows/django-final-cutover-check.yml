name: Django Final Cutover Check
on: push
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Reject Supabase runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            '@supabase'
            'from @/lib/supabase'
            'VITE_SUPABASE'
            'SUPABASE_ANON_KEY'
            'SUPABASE_URL'
            'supabase\.co'
            'functions/v1'
          )
          found=0
          for pattern in "${patterns[@]}"; do
            if git grep -n -I -E "$pattern" -- ':!backend/MIGRATION_STATUS.md' ':!README.md'; then
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo 'Supabase runtime references remain.'
            exit 1
          fi
      - name: Verify obsolete protected API is unused
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I 'djangoLegacyApi' -- ':(exclude)src/lib/djangoLegacyApi.ts'; then
            echo 'djangoLegacyApi still has consumers; keep it transitional.'
          else
            echo 'djangoLegacyApi has no consumers and can be removed in the next cleanup commit.'
          fi
      - name: Clean verification workflow
        run: |
          git config user.name 'SakaKrib Migration Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/django-final-cutover-check.yml
          git add -A
          git commit -m 'chore(migration): remove one-time cutover verification workflow [skip ci]' || exit 0
          git push origin HEAD:django-backend-migration
