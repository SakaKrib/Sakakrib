name: Django Migration Verification Once

on:
  push:
    branches: [django-backend-migration]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Django system checks
        working-directory: backend
        run: python manage.py check
      - name: Migration drift check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Backend Supabase runtime scan
        run: |
          set -euo pipefail
          if git grep -n -I -E '@supabase|supabase\\.co|SUPABASE_|functions/v1' -- 'backend/**' ':(exclude)backend/MIGRATION_STATUS.md'; then
            echo 'Backend Supabase runtime references remain.'
            exit 1
          fi
      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name 'SakaKrib Migration Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/django-migration-verification-once.yml
          git add -A
          git commit -m 'chore(migration): remove one-time migration verification [skip ci]' || exit 0
          git push origin HEAD:django-backend-migration
