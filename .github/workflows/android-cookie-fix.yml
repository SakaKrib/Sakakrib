name: Android APK (WebView Cookies + GPS Permissions)

on:
  push:
    branches:
      - backup/casa-ai-before-push
    paths:
      - "native/android/**"
      - ".github/workflows/android-cookie-fix.yml"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      VITE_DJANGO_API_URL: https://opondo-thinkpad-t14-gen-1.tail34bca9.ts.net
      VITE_FIREBASE_PUSH_ENABLED: "false"

    steps:
      - name: Check out SakaKrib
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React app
        run: npm run build

      - name: Generate Android project
        run: npm run cap:add:android

      - name: Declare Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Android manifest not found: {manifest}")

          content = manifest.read_text(encoding="utf-8")
          entries = [
              ('android.permission.ACCESS_COARSE_LOCATION',
               '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'),
              ('android.permission.ACCESS_FINE_LOCATION',
               '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'),
              ('android.hardware.location.gps',
               '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />'),
          ]

          application_index = content.find("<application")
          if application_index < 0:
              raise SystemExit("Could not find <application> in AndroidManifest.xml")

          missing = [xml for marker, xml in entries if marker not in content]
          if missing:
              content = content[:application_index] + "\n".join(missing) + "\n    " + content[application_index:]
              manifest.write_text(content, encoding="utf-8")

          final_content = manifest.read_text(encoding="utf-8")
          for marker, _ in entries[:2]:
              if marker not in final_content:
                  raise SystemExit(f"Required Android location permission missing: {marker}")

          print("Android coarse and fine location permissions are declared.")
          PY

      - name: Install Saka Krib native WebView configuration
        run: |
          mkdir -p android/app/src/main/java/com/sakakrib/app
          cp native/android/MainActivity.java android/app/src/main/java/com/sakakrib/app/MainActivity.java
          grep -q "setAcceptThirdPartyCookies" android/app/src/main/java/com/sakakrib/app/MainActivity.java

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android location permissions
        run: |
          grep -q "android.permission.ACCESS_COARSE_LOCATION" android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SakaKrib-Android-APK-CookieFix-GPS
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
