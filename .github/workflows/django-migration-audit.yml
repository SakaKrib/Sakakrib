name: Django Migration Audit

on:
  push:
    branches:
      - django-backend-migration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted Django transport migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              p.write_text(text.replace(old, new, 1))

          # Transitional Django compatibility transport. Keep this boundary until
          # each consumer is verified against its concrete Django endpoint.
          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text()
              text = text.replace("@/lib/protectedApi", "@/lib/djangoLegacyApi")
              path.write_text(text)

          # Move only type-only Supabase contracts to the transport-neutral domain types.
          type_import = re.compile(
              r"import\s+type\s+(\{.*?\})\s+from\s+(['\"])(?:@/lib/supabase|\.\.?/.*?/lib/supabase)\2;?",
              re.S,
          )
          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text()
              text = type_import.sub(r"import type \1 from '@/types/domain';", text)
              path.write_text(text)

          # AuthModal: password reset is now handled by Django.
          replace_once(
              'src/components/AuthModal.tsx',
              "import { supabase } from '@/lib/supabase';",
              "import { protectedPost } from '@/lib/djangoApi';",
          )
          replace_once(
              'src/components/AuthModal.tsx',
              """        const { error: resetError } =
          await supabase.auth.resetPasswordForEmail(
            normalizedEmail,
            {
              redirectTo:
                window.location.origin,
            },
          );""",
              """        await protectedPost('/api/accounts/password-reset/', {
          email: normalizedEmail,
          redirect_to: window.location.origin,
        });

        const resetError = null;""",
          )

          # PMS subscription page: preserve the existing UI/RPC-shaped workflow,
          # but route the calls through the verified Django gateway.
          replace_once(
              'src/components/PMS/PMSSubscriptionPage.tsx',
              'import { supabase } from "../../lib/supabase";',
              'import { djangoPmsGateway } from "@/lib/djangoPmsGateway";',
          )
          pms = Path('src/components/PMS/PMSSubscriptionPage.tsx')
          text = pms.read_text().replace('supabase.', 'djangoPmsGateway.')
          pms.write_text(text)

          # ListingManagePage had an unused runtime Supabase import.
          listing_manage = Path('src/pages/ListingManagePage.tsx')
          text = listing_manage.read_text()
          text = text.replace("import { supabase } from '@/lib/supabase';\n", '')
          listing_manage.write_text(text)

          # ChatPage: keep the existing Django-backed implementation and fix the
          # pre-existing JSX parse error on the scheduler error conditional.
          chat = Path('src/pages/ChatPage.tsx')
          text = chat.read_text()
          text = text.replace("@/lib/protectedApi", "@/lib/djangoLegacyApi")
          bad = "{scheduleError && <p className=\"mt-2 text-sm text-destructive\">{scheduleError}</p></div>}"
          good = "{scheduleError && <p className=\"mt-2 text-sm text-destructive\">{scheduleError}</p>}</div>}"
          if bad not in text:
              raise SystemExit('ChatPage scheduler JSX block not found')
          chat.write_text(text.replace(bad, good, 1))

          # DocumentCapture: browser storage operations now use Django private
          # document upload/sign endpoints; no Supabase URL/key is exposed.
          capture = Path('src/components/DocumentCapture.tsx')
          text = capture.read_text()
          if "from '@/lib/djangoApi'" not in text:
              text = text.replace(
                  "import { cn } from '@/lib/utils';",
                  "import { cn } from '@/lib/utils';\nimport { protectedPost, protectedUpload } from '@/lib/djangoApi';",
                  1,
              )
          else:
              text = text.replace(
                  "import { cn } from '@/lib/utils';",
                  "import { cn } from '@/lib/utils';\nimport { protectedPost, protectedUpload } from '@/lib/djangoApi';",
                  1,
              )

          resolve_pattern = re.compile(
              r"  const resolveSignedUrl = useCallback\(.*?\n  \);\n\n  /\*\n  \|--------------------------------------------------------------------------\n  \| STOP CAMERA",
              re.S,
          )
          resolve_replacement = """  const resolveSignedUrl = useCallback(
    async (path: string): Promise<string | null> => {
      try {
        const result = await protectedPost<{ url?: string }>(
          '/api/accounts/kyc/document/sign/',
          { bucket, path },
        );
        return result?.url || null;
      } catch {
        return null;
      }
    },
    [bucket]
  );

  /*
  |--------------------------------------------------------------------------
  | STOP CAMERA"""
          text, count = resolve_pattern.subn(resolve_replacement, text, count=1)
          if count != 1:
              raise SystemExit('DocumentCapture resolveSignedUrl block not found')

          upload_pattern = re.compile(
              r"      const response =\n        await fetch\(\n          `\$\{import\.meta\.env\.VITE_SUPABASE_URL\}/functions/v1/protected-api/storage/upload`,.*?\n      const result =\n        await response\.json\(\);",
              re.S,
          )
          upload_replacement = """      const result = await protectedUpload<{
        path?: string;
        bucket?: string;
        size?: number;
        mime_type?: string;
      }>('/api/accounts/documents/upload/', formData);"""
          text, count = upload_pattern.subn(upload_replacement, text, count=1)
          if count != 1:
              raise SystemExit('DocumentCapture upload block not found')

          text = text.replace(
              "      const publicUrl =\n        result.url ||\n        result.publicUrl;\n\n      const storagePath = result.path;",
              "      const storagePath = result.path;\n      const publicUrl = storagePath;",
              1,
          )
          capture.write_text(text)
          PY

      - name: Verify no Supabase runtime boundary remains
        shell: bash
        run: |
          set -e
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='*.lock' --exclude='django-migration-audit.yml' \
            "@/lib/supabase|from ['\"]supabase|from ['\"]@supabase|createClient\(|supabase\.|VITE_SUPABASE|SUPABASE_URL|SUPABASE_ANON_KEY|supabase\.co|functions/v1" \
            src backend .; then
            echo 'Remaining Supabase runtime references detected.'
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit verified migration changes
        shell: bash
        run: |
          git config user.name 'SakaKrib Migration Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(migration): migrate verified frontend Supabase boundaries [skip ci]'
          git push origin HEAD:django-backend-migration
