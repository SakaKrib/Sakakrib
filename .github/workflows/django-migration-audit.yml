name: Django Migration Audit

on:
  push:
    branches:
      - django-backend-migration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply verified Django transport replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('src')

          # Move all type-only domain contracts away from the removed Supabase module.
          for path in root.rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text()
              text = text.replace("@/lib/protectedApi", "@/lib/djangoLegacyApi")
              text = text.replace("@/lib/supabase", "@/types/domain")
              text = text.replace("../../lib/supabase", "@/types/domain")
              path.write_text(text)

          # ListingManagePage had an unused runtime Supabase import.
          p = Path('src/pages/ListingManagePage.tsx')
          text = p.read_text().replace("import { supabase } from '@/types/domain';\n", '')
          p.write_text(text)

          # AuthModal: password reset is a Django endpoint now.
          p = Path('src/components/AuthModal.tsx')
          text = p.read_text()
          text = text.replace("import { supabase } from '@/types/domain';\n", "import { protectedPost } from '@/lib/djangoApi';\n")
          old = '''        const { error: resetError } =\n          await supabase.auth.resetPasswordForEmail(\n            normalizedEmail,\n            {\n              redirectTo:\n                window.location.origin,\n            },\n          );'''
          new = '''        await protectedPost('/api/accounts/password-reset/', {\n          email: normalizedEmail,\n          redirect_to: window.location.origin,\n        });\n\n        const resetError = null;'''
          if old not in text:
              raise SystemExit('AuthModal password-reset block not found')
          p.write_text(text.replace(old, new))

          # PMSSubscriptionPage keeps its existing UI/workflow but now uses a Django-only gateway.
          p = Path('src/components/PMS/PMSSubscriptionPage.tsx')
          text = p.read_text()
          text = text.replace('import { supabase } from "@/types/domain";', 'import { djangoPmsGateway } from "@/lib/djangoPmsGateway";')
          text = text.replace('supabase.', 'djangoPmsGateway.')
          p.write_text(text)

          # DocumentCapture: replace the two direct Supabase Storage calls with Django upload/sign APIs.
          p = Path('src/components/DocumentCapture.tsx')
          text = p.read_text()
          if "from '@/lib/djangoApi'" not in text:
              text = text.replace("import { cn } from '@/lib/utils';", "import { cn } from '@/lib/utils';\nimport { protectedPost, protectedUpload } from '@/lib/djangoApi';")
          else:
              text = text.replace("import { cn } from '@/lib/utils';", "import { cn } from '@/lib/utils';\nimport { protectedPost, protectedUpload } from '@/lib/djangoApi';")

          resolve_pattern = re.compile(r"  const resolveSignedUrl = useCallback\(.*?\n  \);\n\n  /\*\n  \|--------------------------------------------------------------------------\n  \| STOP CAMERA", re.S)
          resolve_replacement = '''  const resolveSignedUrl = useCallback(\n    async (path: string): Promise<string | null> => {\n      try {\n        const result = await protectedPost<{ url: string }>('/api/accounts/kyc/document/sign/', {\n          bucket,\n          path,\n        });\n        return result?.url || null;\n      } catch {\n        return null;\n      }\n    },\n    [bucket]\n  );\n\n  /*\n  |--------------------------------------------------------------------------\n  | STOP CAMERA'''
          text, count = resolve_pattern.subn(resolve_replacement, text, count=1)
          if count != 1:
              raise SystemExit('DocumentCapture resolveSignedUrl block not found')

          upload_pattern = re.compile(r"      const response =\n        await fetch\(\n          `\$\{import\.meta\.env\.VITE_SUPABASE_URL\}/functions/v1/protected-api/storage/upload`,.*?\n      const result =\n        await response\.json\(\);", re.S)
          upload_replacement = '''      const result = await protectedUpload<{\n        path?: string;\n        bucket?: string;\n        size?: number;\n        mime_type?: string;\n      }>('/api/accounts/documents/upload/', formData);'''
          text, count = upload_pattern.subn(upload_replacement, text, count=1)
          if count != 1:
              raise SystemExit('DocumentCapture upload block not found')

          text = text.replace("      const publicUrl =\n        result.url ||\n        result.publicUrl;\n\n      const storagePath = result.path;", "      const storagePath = result.path;\n      const publicUrl = storagePath;")
          text = text.replace('Supabase Storage upload', 'Django private document upload')
          text = text.replace('Supabase', 'Django')
          p.write_text(text)

          # Rename the Django-only legacy compatibility module according to the migration rule.
          old = Path('src/lib/protectedApi.ts')
          new = Path('src/lib/djangoLegacyApi.ts')
          if old.exists():
              old.unlink()
          if not new.exists():
              raise SystemExit('djangoLegacyApi.ts replacement is missing')
          PY

      - name: Verify no Supabase runtime/import boundary remains
        shell: bash
        run: |
          set -e
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='*.lock' --exclude='django-migration-audit.yml' \
            "@/lib/supabase|from ['\"]supabase|from ['\"]@supabase|createClient\(|supabase\.|VITE_SUPABASE|SUPABASE_URL|SUPABASE_ANON_KEY|supabase\.co|functions/v1" \
            src backend .; then
            echo 'Remaining Supabase runtime references detected.'
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit migration changes
        shell: bash
        run: |
          git config user.name 'SakaKrib Migration Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(migration): cut remaining frontend Supabase runtime dependencies [skip ci]'
          git push origin HEAD:django-backend-migration
