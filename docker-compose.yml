name: sakakrib-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sakakrib}
      POSTGRES_USER: ${POSTGRES_USER:-sakakrib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sakakrib_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sakakrib} -d ${POSTGRES_DB:-sakakrib}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sakakrib}
      DB_USER: ${POSTGRES_USER:-sakakrib}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sakakrib_dev_password}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: python manage.py migrate --noinput
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sakakrib}
      DB_USER: ${POSTGRES_USER:-sakakrib}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sakakrib_dev_password}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: python manage.py runserver 0.0.0.0:8001
    ports:
      - "${SAKAKRIB_BACKEND_PORT:-8001}:8001"
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sakakrib}
      DB_USER: ${POSTGRES_USER:-sakakrib}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sakakrib_dev_password}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A config worker --loglevel=INFO
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sakakrib}
      DB_USER: ${POSTGRES_USER:-sakakrib}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sakakrib_dev_password}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A config beat --loglevel=INFO
    volumes:
      - ./backend:/app
      - celery_beat_data:/app/.celery
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      VITE_DOCKER_API_PROXY_TARGET: http://backend:8001
      VITE_DOCKER_WS_PROXY_TARGET: ws://backend:8001
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "${SAKAKRIB_FRONTEND_PORT:-5175}:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
  frontend_node_modules:
